<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VHS Portfolio</title>

    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <div class="background-glitch phase-main" aria-hidden="true">
        <div class="background-scene background-main"></div>
        <div class="background-scene background-one"></div>
        <div class="background-flash background-flash-1"></div>
        <div class="background-flash background-flash-2"></div>
        <div class="background-main-glitch-flash"></div>
        <div class="background-main-glitch-transition"></div>
    </div>

    <!--WEBSITE-->

    <div class="website">

        <header>
            <h1>PORTFOLIO</h1>

            <nav>
                <a href="#">HOME</a>
                <a href="#">PROJECTS</a>
                <a href="#">ABOUT</a>
            </nav>
        </header>


        <main>

            

            <p>
                Yo.
            </p>

        </main>

    </div>


    <!-- =================================
         VHS EFFECT
    ================================== -->

    <div id="vhs">

        <!-- Moving noise -->
        <div class="noise"></div>

        <!-- CRT scanlines -->
        <div class="scanlines"></div>

        <!-- Monochrome image separation -->
        <div class="glitch-white"></div>
        <div class="glitch-gray"></div>

        <!-- Horizontal VHS tracking -->
        <div class="tracking tracking-1"></div>
        <div class="tracking tracking-2"></div>
        <div class="tracking tracking-3"></div>

        <!-- Strong glitch -->
        <div class="glitch-bars"></div>

    </div>


    <script src="Scripts.js"></script>

</body>

</html>
