<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VHS Portfolio</title>

    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <!-- =================================
         YOUR ACTUAL WEBSITE
    ================================== -->

    <div class="website">

        <header>
            <h1>MY PORTFOLIO</h1>

            <nav>
                <a href="#">HOME</a>
                <a href="#">PROJECTS</a>
                <a href="#">ABOUT</a>
            </nav>
        </header>


        <main>

            <h2>WELCOME</h2>

            <p>
                This is my portfolio website.
            </p>

            <button id="glitchButton">
                ENTER
            </button>

        </main>

    </div>


    <!-- =================================
         VHS EFFECT
    ================================== -->

    <div id="vhs">

        <!-- Moving noise -->
        <div class="noise"></div>

        <!-- CRT scanlines -->
        <div class="scanlines"></div>

        <!-- RGB distortion -->
        <div class="rgb-red"></div>
        <div class="rgb-blue"></div>

        <!-- Horizontal VHS tracking -->
        <div class="tracking tracking-1"></div>
        <div class="tracking tracking-2"></div>
        <div class="tracking tracking-3"></div>

        <!-- Strong glitch -->
        <div class="glitch-bars"></div>

    </div>


    <script src="Scripts.js"></script>

</body>

</html>
